[project]
name = "taskhub-api"
version = "1.0.0"
description = "TaskHub - He thong quan ly cong viec (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "mypy==1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["venv", ".venv", ".uv-cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
exclude = ["venv", ".venv", ".uv-cache"]

[project]
name = "taskhub-api"
version = "1.0.0"
description = "TaskHub - Hệ thống quản lý công việc (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "bcrypt==4.0.1",
    "email-validator==2.2.0",
    "fastapi==0.110.0",
    "passlib==1.7.4",
    "pydantic-settings==2.7.1",
    "python-jose[cryptography]==3.5.0",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.29.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "mypy==1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["venv", ".venv", ".uv-cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
explicit_package_bases = true
exclude = ["venv", ".venv", ".uv-cache"]
